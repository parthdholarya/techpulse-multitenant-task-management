spring:
  application:
    name: multitenant-task-management

  datasource:
    url: jdbc:h2:file:./data/taskmanagementdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000